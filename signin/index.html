<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MusallahBoard Admin Sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/admin.css" />
  </head>
  <body class="signin-body">
    <div class="signin-wrapper">
      <div class="signin-card">
        <div class="signin-header">
          <p class="eyebrow">UTM MSA</p>
          <h1>MusallahBoard Console</h1>
          <p class="muted">Mock login until SSO integration is ready.</p>
        </div>
        <form id="signinForm" class="admin-form">
          <label>
            Email
            <input type="email" name="email" placeholder="you@msa.ca" required />
          </label>
          <label>
            Password
            <input type="password" name="password" placeholder="••••••••" required />
          </label>
          <button type="submit" class="primary-btn block">Enter Dashboard</button>
          <p id="formStatus" class="form-status"></p>
        </form>
        <p class="muted note">
          Tip: credentials are not validated yet. Use any email/password to preview the
          dashboard.
        </p>
        <div class="signin-footer">
          <a href="/">← View Display</a>
        </div>
      </div>
    </div>

    <script>
      (function () {
        const existing = window.__MB_ADMIN_CONFIG__ || {};
        window.__MB_ADMIN_CONFIG__ = {
          apiBase: existing.apiBase ?? "/api/admin",
          useMock: existing.useMock ?? true,
          auth: {
            baseUrl: existing.auth?.baseUrl ?? "/api/auth",
            useMock: existing.auth?.useMock ?? true,
          },
        };
      })();
    </script>
    <script type="module" src="../js/signin.js"></script>
  </body>
</html>
